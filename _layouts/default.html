<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ site.baseurl }}/assets/icon.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/icon.png">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ site.baseurl }}/">
      <img src="{{ site.baseurl }}/assets/icon.png" alt="" width="40" height="40">
      <span>NETCORD</span>
    </a>
    <nav aria-label="Site">
      <a href="{{ site.baseurl }}/privacy/">Privacy</a>
      <a href="{{ site.baseurl }}/support/">Support</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer class="site-footer">
    <p>© 2026 Liniker Seixas. Netcord is a sports tracker, not a medical device.</p>
  </footer>
</body>
</html>
